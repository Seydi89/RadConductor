[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radconductor"
version = "0.1.0"
description = "A local-first agentic workflow engine for medical imaging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy",
    "nibabel",
    "pydicom",
    "SimpleITK",
    "pydantic>=2",
    "typer",
    "rich",
    "pydicom",
    "TotalSegmentator"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
radconductor = "radconductor.cli:main"
radconductor = "radconductor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88